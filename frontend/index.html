<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dobro mjesto</title>
    <script>
      // Light or dark from the device before the app starts, so the page does not flash.
      try {
        var pick = sessionStorage.getItem('dobro-mjesto-tema')
        document.documentElement.dataset.theme =
          pick === 'light' || pick === 'dark'
            ? pick
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
