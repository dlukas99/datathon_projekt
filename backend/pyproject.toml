[project]
name = "prije-potpisa"
version = "0.1.0"
description = "Okolišni pregled adrese u Hrvatskoj iz otvorenih podataka"
license = "EUPL-1.2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=2.0",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyproj>=3.7",
    "pyarrow>=18",
]

[dependency-groups]
ingest = [
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "osmium>=4.3.2",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pandas-stubs>=2.2",
]

[tool.uv]
default-groups = ["ingest", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest", "analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["app", "ingest", "analysis"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "shapely.*", "pyproj.*", "geopandas.*", "pyogrio.*", "pyarrow.*", "osmium.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
